name: Release quota-center

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build and verify archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          make clean checksums GOOS="$GOOS" GOARCH="$GOARCH"
          python3 scripts/verify_release_assets.py \
            --archive "dist/quota-center_${VERSION}_${GOOS}_${GOARCH}.zip" \
            --sha256 "dist/quota-center_${VERSION}_${GOOS}_${GOARCH}.zip.sha256"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: quota-center-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/quota-center_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
            dist/quota-center_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish immutable release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Assemble aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archive_files=(release-artifacts/*.zip)
          checksum_files=(release-artifacts/*.zip.sha256)
          test "${#archive_files[@]}" -gt 0
          test "${#archive_files[@]}" -eq "${#checksum_files[@]}"
          cat "${checksum_files[@]}" | LC_ALL=C sort > release-artifacts/checksums.txt
          test -s release-artifacts/checksums.txt

      - name: Refuse an existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          rm -f "$body"
          if [ "$status" = "200" ]; then
            echo "Release $GITHUB_REF_NAME already exists; releases are immutable."
            exit 1
          fi
          test "$status" = "404"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
